[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elearning-converter"
version = "0.1.0"
description = "Convert authorized MP4 lecture audio to review Markdown"
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.1,<2", "google-genai>=1,<2"]

[project.scripts]
elconv = "elearning_converter.__main__:run"

[tool.setuptools.packages.find]
include = ["elearning_converter*"]
